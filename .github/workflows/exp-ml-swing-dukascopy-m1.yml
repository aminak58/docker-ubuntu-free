name: EXP ML Swing Dukascopy M1

on:
  push:
    branches:
      - experiment/exp-ml-swing-continuation-dukascopy-m1

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded statistical dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "scikit-learn>=1.5,<2"
      - name: Dukascopy XAUUSD M1 BID acquisition
        run: |
          python experiments/exp-ml-swing-continuation-dukascopy-m1/download.py \
            --from-date 2026-09-01 --to-exclusive 2026-09-09 \
            --outdir runner-output
      - name: Validate frozen-detector events without model training
        run: |
          python experiments/exp-ml-swing-continuation-dukascopy-m1/analyze.py \
            --data runner-output/xauusd_m1_bid.csv \
            --outdir runner-output --mode smoke
      - name: Archive research evidence (one day only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-m1-smoke-evidence
          path: runner-output/
          retention-days: 1
          if-no-files-found: warn
